    .ink { stroke: #111418; }
    .seal { stroke: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #eceff3; }
      .seal { stroke: #6096ff; }
    }
  </style>
  <g class="ink" stroke-width="2.6" stroke-linecap="round">
    <path d="M8 27.5v-8.5" />
    <path d="M16 27.5v-12.5" />
    <path d="M24 27.5v-5.5" />
  </g>
  <circle class="seal" cx="16" cy="7.5" r="3.4" stroke-width="2.2" />
</svg>
